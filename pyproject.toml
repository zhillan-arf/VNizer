[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vnizer"
version = "0.1.0"
description = "Convert PDF documents into narrated visual novel videos."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.18,<1",
  "python-dotenv>=1,<2",
  "itsdangerous>=2.2,<3",
  "pymupdf>=1.24,<2",
  "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "playwright>=1.50,<2"]

[project.scripts]
vnizer = "vnizer.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
